[package]
name = "netdog-server"
version = "0.1.0"
edition = "2021"
description = "Alert server for netdog agents: receives WebSocket heartbeats and emails when a device goes offline (dead-man switch) or reports unhealthy."
license = "MIT"
repository = "https://github.com/wilinz/netdog-server"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
    "ring",
    "hostname",
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
